    <style>
      /* Completely eliminate OneSignal default white slidedown popup */
      #onesignal-slidedown-container,
      #onesignal-slidedown-dialog,
      .onesignal-slidedown-container,
      .onesignal-slidedown-dialog,

    <!-- OneSignal Web Push SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      // Gracefully handle OneSignal domain restriction on non-production/preview URLs
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          (typeof event.reason.message === 'string' && event.reason.message.includes('Can only be used on')) ||
          (typeof event.reason === 'string' && event.reason.includes('Can only be used on'))
        )) {
          event.preventDefault();
          console.warn('[OneSignal] SDK origin notice:', event.reason?.message || event.reason);
        }
      });

      // Aggressively remove any OneSignal automatic slidedown prompt from the DOM
      (function() {
        function removeSlidedown() {
          var el = document.getElementById('onesignal-slidedown-container') ||
                   document.getElementById('onesignal-slidedown-dialog') ||
                   document.querySelector('.onesignal-slidedown-container') ||
                   document.querySelector('.onesignal-slidedown-dialog') ||
                   document.getElementById('onesignal-bell-container');
          if (el && el.parentNode) {
            el.parentNode.removeChild(el);
          }
        }
        if (typeof window !== 'undefined' && typeof MutationObserver !== 'undefined') {
          var observer = new MutationObserver(removeSlidedown);
          observer.observe(document.documentElement, { childList: true, subtree: true });
          window.addEventListener('DOMContentLoaded', removeSlidedown);
          window.addEventListener('load', removeSlidedown);
        }
      })();

      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        try {
          window.OneSignal = OneSignal;
          await OneSignal.init({
            appId: "b4eeea32-69c4-4ef9-a0d4-d6a8bbc8cde0",
            allowLocalhostAsSecureOrigin: true,
            autoRegister: false,
            autoResubscribe: false,
            promptOptions: {
              slidedown: {
                prompts: []
              }
            },
            serviceWorkerPath: "OneSignalSDKWorker.js",
            serviceWorkerParam: { scope: "/" }
          });
          // Explicitly cancel any pending slidedown prompt
          try {
            if (OneSignal.Slidedown && typeof OneSignal.Slidedown.cancel === 'function') {
              OneSignal.Slidedown.cancel();
            }
          } catch (e) {}
          console.log('[OneSignal] Initialized successfully with App ID: b4eeea32-69c4-4ef9-a0d4-d6a8bbc8cde0 (Auto-prompt disabled)');
        } catch (err) {
          console.warn('[OneSignal] Initialization skipped on current preview origin:', err?.message || err);
        }
      });
    </script>
