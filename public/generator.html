<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eduzone - المولد الشامل 2027 - 33 مادة</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-white p-4 font-sans">

<div class="max-w-4xl mx-auto">
<h1 class="text-3xl font-black text-yellow-400 mb-2">Eduzone - مولد الملخصات الشامل</h1>
<p class="text-gray-300 mb-2">33 مادة × 15 صفحة = 495 صفحة كاملة - منهج 2026/2027 بدون اختصار</p>
<p class="text-xs text-gray-500 mb-4">يشمل: عام علمي علوم / علمي رياضة / أدبي / لغات / تجارة / صنايع / زراعة</p>

<input id="apiKey" placeholder="حط مفتاح Gemini API هنا" class="w-full p-4 rounded-xl bg-gray-800 mb-3 text-white border-2 border-yellow-400 focus:outline-none">

<div class="grid grid-cols-2 gap-2 mb-4">
<div class="bg-gray-800 p-2 rounded text-xs">📚 ثانوي عام: 12 مادة</div>
<div class="bg-blue-900 p-2 rounded text-xs">🌍 ثانوي لغات: 9 مواد</div>
<div class="bg-green-900 p-2 rounded text-xs">💼 دبلومات: 12 مادة</div>
<div class="bg-yellow-900 p-2 rounded text-xs">📦 الإجمالي: 33 مادة</div>
</div>

<button onclick="startAll()" class="bg-yellow-400 text-black w-full p-5 rounded-xl font-black text-xl hover:bg-yellow-300">🚀 ابدأ توليد كل المواد (495 صفحة)</button>

<div id="progress" class="bg-black p-4 rounded-xl mt-4 text-sm border border-gray-700">جاهز للبدء...</div>
<div id="log" class="bg-black p-4 rounded-xl mt-3 h-[500px] overflow-auto text-xs leading-7 border border-gray-700"></div>

<div class="mt-4 flex gap-2">
<button onclick="downloadAll()" class="bg-gray-700 p-3 rounded-xl flex-1">📦 تحميل ملف مجمع</button>
<button onclick="clearLog()" class="bg-red-900 p-3 rounded-xl">🗑️ مسح</button>
</div>
</div>

<script>
const ALL_SUBJECTS = [
  // ثانوي عام علمي علوم
  { شعبة: "ثانوية عامة علمي علوم", مادة: "فيزياء", كود: "physics_science" },
  { شعبة: "ثانوية عامة علمي علوم", مادة: "كيمياء", كود: "chemistry_science" },
  { شعبة: "ثانوية عامة علمي علوم", مادة: "أحياء", كود: "biology" },
  { شعبة: "ثانوية عامة علمي علوم", مادة: "جيولوجيا وعلوم بيئية", كود: "geology" },
  // علمي رياضة
  { شعبة: "ثانوية عامة علمي رياضة", مادة: "فيزياء", كود: "physics_math" },
  { شعبة: "ثانوية عامة علمي رياضة", مادة: "كيمياء", كود: "chemistry_math" },
  { شعبة: "ثانوية عامة علمي رياضة", مادة: "رياضة بحتة - جبر وتفاضل وتكامل", كود: "pure_math" },
  { شعبة: "ثانوية عامة علمي رياضة", مادة: "رياضة تطبيقية - استاتيكا وديناميكا", كود: "applied_math" },
  // أدبي
  { شعبة: "ثانوية عامة أدبي", مادة: "تاريخ", كود: "history" },
  { شعبة: "ثانوية عامة أدبي", مادة: "جغرافيا", كود: "geography" },
  { شعبة: "ثانوية عامة أدبي", مادة: "فلسفة ومنطق", كود: "philosophy" },
  { شعبة: "ثانوية عامة أدبي", مادة: "علم نفس واجتماع", كود: "psychology" },
  // ثانوي لغات - كامل
  { شعبة: "ثانوي لغات علمي علوم", مادة: "Physics - فيزياء لغات", كود: "physics_languages" },
  { شعبة: "ثانوي لغات علمي علوم", مادة: "Chemistry - كيمياء لغات", كود: "chemistry_languages" },
  { شعبة: "ثانوي لغات علمي علوم", مادة: "Biology - أحياء لغات", كود: "biology_languages" },
  { شعبة: "ثانوي لغات علمي رياضة", مادة: "Pure Mathematics - رياضة بحتة لغات", كود: "pure_math_languages" },
  { شعبة: "ثانوي لغات علمي رياضة", مادة: "Applied Mechanics - ميكانيكا لغات", كود: "mechanics_languages" },
  { شعبة: "ثانوي لغات أدبي", مادة: "History & Geography - تاريخ وجغرافيا لغات", كود: "history_geo_lang" },
  { شعبة: "ثانوي لغات", مادة: "English High Level - انجليزي مستوى رفيع", كود: "english_high" },
  { شعبة: "ثانوي لغات", مادة: "French Second Language - فرنساوي لغة ثانية", كود: "french_lang" },
  { شعبة: "ثانوي لغات", مادة: "German - ألماني لغات", كود: "german_lang" },
  // مشترك
  { شعبة: "مشترك ثانوي عام", مادة: "لغة عربية", كود: "arabic" },
  { شعبة: "مشترك ثانوي عام", مادة: "لغة انجليزية", كود: "english" },
  { شعبة: "مشترك ثانوي عام", مادة: "لغة فرنسية عامة", كود: "french_general" },
  // تجارة
  { شعبة: "دبلوم تجارة", مادة: "محاسبة مالية", كود: "accounting" },
  { شعبة: "دبلوم تجارة", مادة: "إدارة أعمال وسكرتارية", كود: "business" },
  { شعبة: "دبلوم تجارة", مادة: "اقتصاد واحصاء", كود: "economics" },
  { شعبة: "دبلوم تجارة", مادة: "قانون تجاري", كود: "commercial_law" },
  // صنايع
  { شعبة: "دبلوم صنايع", مادة: "رسم فني وميكانيكا", كود: "technical_drawing" },
  { شعبة: "دبلوم صنايع", مادة: "فيزياء صنايع", كود: "physics_tech" },
  { شعبة: "دبلوم صنايع", مادة: "رياضة صنايع", كود: "math_tech" },
  // زراعة
  { شعبة: "دبلوم زراعة", مادة: "محاصيل زراعية وانتاج حيواني", كود: "agriculture" },
  { شعبة: "دبلوم زراعة", مادة: "كيمياء وأراضي زراعية", كود: "agriculture_chem" },
];

let generated = [];
function log(msg){ document.getElementById('log').innerHTML += `<div class="border-b border-gray-800 py-1">${msg}</div>`; document.getElementById('log').scrollTop = 999999; }
function progress(msg){ document.getElementById('progress').innerHTML = msg; }
function clearLog(){ document.getElementById('log').innerHTML = ''; generated = []; }

async function generateOne(sub, apiKey){
  const prompt = `
أنت خبير مناهج وزارة التربية والتعليم المصرية 2026/2027 - تخصص ${sub.شعبة}.
اكتب ملخص كامل 15 صفحة لمادة: ${sub.مادة} - شعبة: ${sub.شعبة}

قواعد إجبارية بدون اختصار:
- كل صفحة 500 كلمة على الأقل.
- لا تتوقف حتى تكمل 15 صفحة.
- التقسيم:
صفحة 1: مقدمة وتوزيع درجات وخريطة منهج
صفحة 2-3: الفصل الأول تفصيلي
صفحة 4-5: الفصل الثاني تفصيلي
صفحة 6: الفصل الثالث
صفحة 7: الفصل الرابع
صفحة 8: الفصل الخامس
صفحة 9: الفصل السادس
صفحة 10: الفصل السابع والثامن
صفحة 11: جدول القوانين
صفحة 12: جدول التعريفات
صفحة 13: مقارنات ورسومات
صفحة 14: 60 سؤال متوقع بالاجابات
صفحة 15: خريطة ذهنية ونصائح + "إعداد منصة Eduzone"
- لو المادة لغات اكتب المصطلح بالانجليزي والعربي معا.
- منهج 2026/2027 كامل بدون حذف.
- في نهاية كل صفحة اكتب [انتهت صفحة X]
- في النهاية اكتب [انتهى ملخص ${sub.مادة} 15 صفحة]

ابدأ الآن بصفحة 1 فورا.
`;

  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({contents:[{parts:[{text:prompt}]}], generationConfig:{maxOutputTokens:16000, temperature:0.4}})
    });
    const data = await res.json();
    if(!data.candidates) throw new Error(JSON.stringify(data).slice(0,200));
    const text = data.candidates[0].content.parts[0].text;
    generated.push({...sub, content:text});
    const blob = new Blob([text], {type:"text/markdown;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=`${sub.شعبة} - ${sub.مادة} - 15 صفحة.md`; a.click();
    log(`✅ ${sub.شعبة} - ${sub.مادة} | ${text.length} حرف`);
    return true;
  }catch(e){ log(`❌ فشل ${sub.مادة}: ${e.message}`); return false; }
}

async function startAll(){
  const apiKey = document.getElementById('apiKey').value.trim();
  if(!apiKey){ alert("حط مفتاح API"); return; }
  progress(`🚀 بدأنا ${ALL_SUBJECTS.length} مادة...`);
  for(let i=0;i<ALL_SUBJECTS.length;i++){
    const sub = ALL_SUBJECTS[i];
    progress(`⏳ [${i+1}/${ALL_SUBJECTS.length}] ${sub.شعبة} - ${sub.مادة}`);
    log(`⏳ جاري: ${sub.شعبة} - ${sub.مادة}`);
    await generateOne(sub, apiKey);
    await new Promise(r=>setTimeout(r, 4000));
  }
  progress(`🎉 انتهى! ${ALL_SUBJECTS.length} مادة × 15 صفحة = ${ALL_SUBJECTS.length*15} صفحة`);
}

function downloadAll(){
  if(generated.length==0){ alert("لسه مولدتش"); return; }
  let all = generated.map(s=>`# ${s.شعبة} - ${s.مادة}\n\n${s.content}\n\n---\n`).join('');
  const blob = new Blob([all], {type:"text/markdown"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`Eduzone-33-مادة-495-صفحة.md`; a.click();
}
</script>
</body>
</html>
